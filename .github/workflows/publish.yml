name: Publish Extension

# Versioning convention:
#   Odd minor  (e.g. 0.7.0, 0.9.0)  → pre-release tier  (published with --pre-release)
#   Even minor (e.g. 0.8.0, 1.0.0)  → stable tier       (published normally)
#
# CI reads the minor version from package.json at merge time and sets the flag automatically.
# You never need to pass --pre-release manually.
#
# Release governance SSOT: docs/RELEASE_POLICY.md

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'package.json' # 只有版本號更新時才觸發，避免浪費資源

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 取得完整歷史以便比對版本號

      - name: Check if version changed
        id: check_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch. Forcing publish of $(node -p "require('./package.json').version")."
            echo "changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          prev_version=$(git show HEAD~1:package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version" 2>/dev/null || echo "none")
          curr_version=$(node -p "require('./package.json').version")
          if [ "$prev_version" = "$curr_version" ]; then
            echo "Version has not changed ($curr_version). Skipping publish."
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "Version changed from $prev_version to $curr_version. Proceeding with publish."
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Determine release type (pre-release vs stable)
        if: steps.check_version.outputs.changed == 'true'
        id: release_type
        run: |
          minor=$(node -p "require('./package.json').version.split('.')[1]")
          if (( minor % 2 == 1 )); then
            echo "flags=--pre-release" >> $GITHUB_OUTPUT
            echo "Release type: pre-release (odd minor: $minor)"
          else
            echo "flags=" >> $GITHUB_OUTPUT
            echo "Release type: stable (even minor: $minor)"
          fi

      - name: Setup Node.js
        if: steps.check_version.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        if: steps.check_version.outputs.changed == 'true'
        run: npm ci

      - name: Type check
        if: steps.check_version.outputs.changed == 'true'
        run: npx tsc -p ./

      - name: Run Unit and Property tests
        if: steps.check_version.outputs.changed == 'true'
        run: npm test

      - name: Package extension
        if: steps.check_version.outputs.changed == 'true'
        run: npx @vscode/vsce package --out virtual-tabs.vsix ${{ steps.release_type.outputs.flags }}

      - name: Publish to Marketplace
        if: steps.check_version.outputs.changed == 'true'
        run: npx @vscode/vsce publish -p ${{ secrets.VSCE_PAT }} --packagePath virtual-tabs.vsix --skip-duplicate ${{ steps.release_type.outputs.flags }}

      - name: Publish to Open VSX
        if: steps.check_version.outputs.changed == 'true'
        run: npx ovsx publish virtual-tabs.vsix -p ${{ secrets.OPEN_VSX_TOKEN }} --skip-duplicate ${{ steps.release_type.outputs.flags }}
